<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Raphael Ifergan - AI and Data Engineering</title>
  <desc id="desc">Animated agentic AI control-plane banner with context, tools, memory and evaluation nodes.</desc>
  <style>
    .trace {
      stroke-dasharray: 8 13;
      animation: trace 13s linear infinite;
    }
    .node-a { animation: breathe 4.8s ease-in-out infinite; transform-origin: 830px 94px; }
    .node-b { animation: breathe 4.8s ease-in-out infinite 1.1s; transform-origin: 1012px 116px; }
    .node-c { animation: breathe 4.8s ease-in-out infinite 2.2s; transform-origin: 940px 234px; }
    .cursor { animation: blink 1.25s steps(1) infinite; }
    @keyframes trace { to { stroke-dashoffset: -220; } }
    @keyframes breathe { 0%,100% { opacity: .78; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .node-a, .node-b, .node-c, .cursor { animation: none; }
    }
  </style>

  <rect width="1200" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="1160" height="280" rx="24" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="2"/>

  <g opacity=".5">
    <path d="M80 86H1120M80 138H1120M80 190H1120M80 242H1120" stroke="#EDF2F7"/>
    <path d="M194 52V268M328 52V268M462 52V268M596 52V268M730 52V268M864 52V268M998 52V268" stroke="#EDF2F7"/>
  </g>

  <g transform="translate(74 72)">
    <rect x="0" y="0" width="72" height="72" rx="20" fill="#111827"/>
    <path d="M20 47L36 18L52 47H43L39 39H29L25 47H20Z" fill="#FFFFFF"/>
    <path d="M31 33H37L34 27L31 33Z" fill="#60A5FA"/>
    <path d="M51 18L64 10L70 23L57 31L51 18Z" fill="#F59E0B"/>
  </g>

  <text x="174" y="112" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="850" letter-spacing="-1">Raphael Ifergan</text>
  <text x="177" y="151" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">AI &amp; Data Engineering</text>
  <text x="177" y="197" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="820">
    GenAI <tspan fill="#2563EB">/</tspan> Agentic AI <tspan fill="#2563EB">/</tspan> RAG <tspan fill="#2563EB">/</tspan> Applied ML
  </text>
  <rect class="cursor" x="699" y="174" width="4" height="32" rx="2" fill="#F59E0B"/>

  <g transform="translate(177 232)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="760">
    <rect x="0" y="0" width="86" height="38" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="22" y="25" fill="#1D4ED8">Paris</text>
    <rect x="102" y="0" width="172" height="38" rx="13" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="125" y="25" fill="#047857">Open Sep 2026</text>
    <rect x="290" y="0" width="122" height="38" rx="13" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="316" y="25" fill="#9A3412">ISEP</text>
    <rect x="428" y="0" width="160" height="38" rx="13" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="453" y="25" fill="#6D28D9">Renault Group</text>
  </g>

  <g transform="translate(762 58)">
    <rect x="0" y="0" width="344" height="220" rx="24" fill="#0F172A"/>
    <rect x="18" y="18" width="308" height="184" rx="18" fill="#111C2E" stroke="#22314A"/>

    <text x="34" y="48" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.8">CONTROLLED AGENTIC WORKFLOW</text>

    <g class="node-a">
      <rect x="44" y="72" width="96" height="42" rx="14" fill="#1D4ED8"/>
      <text x="70" y="99" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">context</text>
    </g>
    <g>
      <rect x="124" y="126" width="96" height="42" rx="14" fill="#172554" stroke="#60A5FA"/>
      <text x="154" y="153" fill="#BFDBFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">model</text>
    </g>
    <g class="node-b">
      <rect x="216" y="94" width="86" height="42" rx="14" fill="#047857"/>
      <text x="244" y="121" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">tools</text>
    </g>
    <g class="node-c">
      <rect x="198" y="166" width="104" height="42" rx="14" fill="#7C2D12"/>
      <text x="226" y="193" fill="#FFEDD5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">review</text>
    </g>
    <g>
      <rect x="38" y="154" width="88" height="42" rx="14" fill="#3B0764"/>
      <text x="58" y="181" fill="#F3E8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">memory</text>
    </g>

    <path class="trace" d="M140 93C166 102 183 116 199 134" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    <path class="trace" d="M220 144C239 134 246 128 259 116" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
    <path class="trace" d="M256 136C259 153 258 161 250 166" stroke="#FDBA74" stroke-width="4" stroke-linecap="round"/>
    <path class="trace" d="M198 169C157 191 116 194 82 176" stroke="#C084FC" stroke-width="4" stroke-linecap="round"/>
    <path class="trace" d="M82 154C77 125 88 109 118 98" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
