<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Raphael Ifergan - AI and Data Engineering</title>
  <desc id="desc">Animated profile banner showing a data-to-RAG pipeline with documents, embedding nodes and a sourced answer panel.</desc>
  <style>
    .flow {
      stroke-dasharray: 10 16;
      animation: flow 14s linear infinite;
    }
    .pulse-a { animation: pulse 4s ease-in-out infinite; }
    .pulse-b { animation: pulse 4s ease-in-out infinite 1s; }
    .pulse-c { animation: pulse 4s ease-in-out infinite 2s; }
    .doc-float {
      transform: translate(738px, 74px);
      animation: docFloat 7s ease-in-out infinite;
    }
    .cursor { animation: blink 1.3s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -260; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes docFloat {
      0%, 100% { transform: translate(738px, 74px); }
      50% { transform: translate(738px, 66px); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse-a, .pulse-b, .pulse-c, .doc-float, .cursor { animation: none; }
    }
  </style>

  <rect width="1200" height="360" rx="28" fill="#F8FAFC"/>
  <rect x="18" y="18" width="1164" height="324" rx="24" fill="#FFFFFF" stroke="#DDE6F1" stroke-width="2"/>

  <g opacity=".42">
    <path d="M40 292C164 244 264 326 410 270C556 214 623 218 754 264C880 308 992 211 1160 247" stroke="#DBEAFE" stroke-width="56"/>
    <path d="M64 86H1136M64 138H1136M64 190H1136M64 242H1136" stroke="#EEF2F7"/>
    <path d="M188 44V316M334 44V316M480 44V316M626 44V316M772 44V316M918 44V316M1064 44V316" stroke="#EEF2F7"/>
  </g>

  <g transform="translate(72 72)">
    <rect width="94" height="94" rx="23" fill="#101828"/>
    <path d="M28 24H61C74 24 82 31 82 43C82 51 78 57 70 61C80 64 86 71 86 81C86 96 75 104 59 104H28V24Z" fill="#FFFFFF" transform="scale(.76) translate(13 3)"/>
    <path d="M62 38L82 26L92 44L72 56L62 38Z" fill="#F59E0B" transform="scale(.76) translate(13 3)"/>
  </g>

  <text x="190" y="115" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">Raphael Ifergan</text>
  <text x="193" y="159" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">AI &amp; Data Engineering</text>
  <text x="193" y="205" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">
    GenAI <tspan fill="#2563EB">/</tspan> RAG <tspan fill="#2563EB">/</tspan> Applied ML
  </text>
  <rect class="cursor" x="592" y="181" width="4" height="34" rx="2" fill="#F59E0B"/>

  <g transform="translate(193 242)">
    <rect width="124" height="44" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="26" y="29" fill="#1E3A8A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Python</text>
    <rect x="140" width="140" height="44" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="166" y="29" fill="#065F46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">LLM Apps</text>
    <rect x="296" width="116" height="44" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="323" y="29" fill="#9A3412" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">RAG</text>
    <rect x="428" width="154" height="44" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="454" y="29" fill="#5B21B6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Data Products</text>
  </g>

  <g class="doc-float">
    <rect x="0" y="0" width="126" height="166" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="22" y="30" width="80" height="10" rx="5" fill="#2563EB"/>
    <rect x="22" y="58" width="58" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="22" y="84" width="86" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="22" y="110" width="70" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="22" y="136" width="46" height="9" rx="4.5" fill="#CBD5E1"/>
  </g>

  <g transform="translate(904 72)">
    <circle class="pulse-a" cx="38" cy="38" r="20" fill="#2563EB"/>
    <circle class="pulse-b" cx="120" cy="68" r="16" fill="#10B981"/>
    <circle class="pulse-c" cx="76" cy="134" r="18" fill="#F59E0B"/>
    <circle cx="160" cy="146" r="11" fill="#7A1832"/>
    <path class="flow" d="M38 38C72 43 91 51 120 68C107 97 91 114 76 134C110 139 136 142 160 146" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 38L76 134M120 68L160 146" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <g transform="translate(974 214)">
