    <text x="18" y="28" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">sourced answer</text>
    <rect x="18" y="42" width="96" height="8" rx="4" fill="#93C5FD"/>
    <rect x="18" y="58" width="112" height="8" rx="4" fill="#34D399"/>
