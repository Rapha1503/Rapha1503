<svg width="1180" height="360" viewBox="0 0 1180 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Raphael Ifergan technical stack</title>
  <desc id="desc">Uniform colorful stack grid for AI, data, LLM systems and delivery tools.</desc>
  <rect width="1180" height="360" rx="26" fill="#F8FAFC"/>
